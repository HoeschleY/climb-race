<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climb Race Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(180deg,rgba(17,23,31,.95),rgba(7,10,15,.95));--frame:#463714;--cond:'Barlow Condensed',system-ui,sans-serif;--line:rgba(200,170,110,.35);--gold:#c8aa6e;--txt:#e8e6e1;--mut:#8b929c;--good:#43c286;--bad:#e5555f;--teal:#0ac8b9}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--txt);font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;overflow:hidden}
body.page{background:#05080c}
#ov{position:relative;width:320px;background:var(--bg);border:1px solid var(--frame);border-radius:3px;box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 0 0 1px rgba(200,170,110,.06)}
#ov::before,#ov::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--gold);pointer-events:none}
#ov::before{top:-2px;left:-2px;border-right:0;border-bottom:0}#ov::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);-webkit-app-region:drag;cursor:move}
header b{color:var(--gold);letter-spacing:.08em;font:600 14px var(--cond);text-transform:uppercase}
header .sp{flex:1}
header select,header button{-webkit-app-region:no-drag;background:#151b24;color:var(--txt);border:1px solid #2a323d;border-radius:4px;font:inherit;padding:1px 4px;cursor:pointer}
.dotl{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.dotl.on{background:var(--teal);box-shadow:0 0 6px var(--teal)}
section{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
section:last-child{border-bottom:0}
h4{margin:2px 0 5px;font:600 12px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:#c8aa6e;display:flex;align-items:center;gap:6px}
h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(200,170,110,.35),transparent);order:1}
h4 span{order:2}
h4 span{color:var(--teal);font:600 12px var(--cond);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:6px;padding:2px 0}
.row img{width:24px;height:24px;border-radius:2px;background:#1d2430;flex:none;border:1px solid var(--frame)}
.row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n small{color:var(--mut)}
.r{font:500 13px var(--cond);letter-spacing:.02em;white-space:nowrap;color:#a9b0ba}
.tag{font-size:9.5px;padding:0 4px;border-radius:3px;margin-left:3px;font-weight:600}
.t-duo{background:#3b2f63;color:#c9b8ff}.t-thr{background:#5a1f25;color:#ffb3b8}.t-weak{background:#173f2d;color:#9be8c0}.t-hot{background:#5a3b12;color:#ffcf8a}
.why{color:var(--mut);font-size:11px;padding:0 0 2px 28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.stats div{background:rgba(255,255,255,.04);border-radius:4px;padding:3px 0}
.stats b{display:block;font:600 18px/1.1 var(--cond)}
.stats small{color:var(--mut);font-size:9.5px;text-transform:uppercase}
.st .pos{width:14px;color:var(--gold);font-weight:700;text-align:center}
.st.me .n{color:var(--gold);font-weight:600}
.g{color:var(--good)}.l{color:var(--bad)}
.muted{color:var(--mut)}
#ov.min section{display:none}
.icons{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin:2px 0 4px}
.icons img{width:26px;height:26px;border-radius:2px;background:#1d2430;border:1px solid var(--frame)}
.icons img.rn{border-radius:50%;border-color:transparent;background:#0b0f15}
.icons .lbl{color:var(--mut);font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;width:44px}
.icons .k{width:32px;height:32px;box-shadow:0 0 0 1px var(--gold)}
.form{color:var(--mut);font-size:11px;padding:0 0 2px 28px}
a.ext{color:var(--teal);text-decoration:none;font-size:11px}
.hint{color:var(--mut);font-size:10px;padding:4px 8px}
#live.compact .form,#live.compact .why{display:none}
#mode{max-width:96px}
.pv{background:#3a2a10;color:#ffcf8a;font-size:10px;padding:2px 8px;text-align:center}
.drow{display:flex;align-items:center;gap:6px;padding:2px 0}
.drow img{width:30px;height:30px;border-radius:2px;background:#1d2430;flex:none;border:1px solid var(--frame)}
.drow img.hv{opacity:.45;outline:1px dashed var(--mut)}
.drow .n{flex:1;min-width:0}
.drow .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .n small{color:var(--mut);display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:1px}
.chip{font-size:9.5px;padding:0 4px;border-radius:3px;background:#1d2a33;color:#9fd8d2}
.chip.bad{background:#3a1d22;color:#ffb3b8}
.sc{font:700 15px var(--cond);color:var(--gold);width:30px;text-align:right}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picks .col h5{margin:0 0 2px;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mini{display:flex;align-items:center;gap:4px;padding:1px 0;font-size:11px;white-space:nowrap;overflow:hidden}
.mini img{width:20px;height:20px;border-radius:2px;background:#1d2430;border:1px solid var(--frame)}
.mini.me{color:var(--gold)}
.turn{color:var(--teal);font-weight:600}
.banrow img{width:18px;height:18px;border-radius:3px;filter:grayscale(1) brightness(.6)}
.card .why{padding-left:0}
.card{background:rgba(255,255,255,.025);border:1px solid rgba(200,170,110,.14);border-radius:3px;padding:6px;margin-top:2px}
.vars{display:flex;gap:4px;margin:0 0 6px}
.vars button{flex:1;-webkit-app-region:no-drag;cursor:pointer;background:#10161e;color:#a9b0ba;border:1px solid #2a323d;border-radius:2px;padding:3px 0;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.vars button small{display:block;font:500 10px system-ui;letter-spacing:0;text-transform:none;color:var(--mut)}
.vars button.on{background:linear-gradient(180deg,#1e2a2a,#0f1a1b);color:#f0e6d2;border-color:var(--gold);box-shadow:inset 0 0 8px rgba(10,200,185,.18)}
.skg{display:grid;grid-template-columns:24px repeat(18,1fr);gap:1px;margin:3px 0 2px}
.skg .k{display:flex;align-items:center;justify-content:center}
.skg .k img{width:20px;height:20px;border-radius:2px;border:1px solid var(--frame)}
.skg .k b{font:700 12px var(--cond);color:#a9b0ba}
.skg i{height:20px;background:rgba(255,255,255,.04);border-radius:1px;font:600 10px/20px var(--cond);text-align:center;font-style:normal;color:#0b0f15}
.skg i.Q{background:#0ac8b9}.skg i.W{background:#c8aa6e}.skg i.E{background:#9b7cf0}.skg i.R{background:#e5555f}
.skline{display:flex;align-items:center;gap:6px;font:600 13px var(--cond);letter-spacing:.04em;color:#f0e6d2;margin-top:2px}
.skline .ar{color:var(--mut)}
.skline .lbl{color:var(--mut);font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;width:44px}
</style>
</head>
<body>
<div id="ov">
  <header><i class="dotl" id="dot"></i><b>Race</b><span class="sp"></span>
    <select id="me" title="Who are you?"></select>
    <select id="mode" title="Auto follows your League client. The other choices preview each screen with sample data.">
      <option value="auto">Auto</option>
      <optgroup label="Preview"><option value="ChampSelect">Champ select</option><option value="Loading">Loading screen</option><option value="InGame">In game</option><option value="Neutral">Neutral</option></optgroup>
    </select>
    <button id="min" title="Collapse">–</button></header>
  <div class="pv" id="pv" hidden></div>
  <section id="draft" hidden></section>
  <section id="live" hidden></section>
  <section id="sess"></section>
  <section id="stand"></section>
</div>
<script>
const TIERS=["IRON","BRONZE","SILVER","GOLD","PLATINUM","EMERALD","DIAMOND","MASTER","GRANDMASTER","CHALLENGER"],DIV={IV:0,III:1,II:2,I:3};
const cap=s=>s?s[0]+s.slice(1).toLowerCase():"";
const score=r=>{if(!r)return null;const i=TIERS.indexOf(r.tier);return i>=7?2800+r.lp:i*400+(DIV[r.division]??0)*100+r.lp};
const fmtS=r=>!r?"Unranked":TIERS.indexOf(r.tier)>=7?`${cap(r.tier).slice(0,2)} ${r.lp}`:`${cap(r.tier)[0]}${{IV:4,III:3,II:2,I:1}[r.division]} ${r.lp}`;
const short=id=>(id||"").split("#")[0];
const sgn=n=>(n>0?"+":"")+n;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const dayKey=t=>{const d=new Date(t);d.setHours(0,0,0,0);return+d};
const ROLE_ORDER={TOP:0,JUNGLE:1,MIDDLE:2,BOTTOM:3,UTILITY:4},byRole=(a,b)=>(ROLE_ORDER[a.role]??9)-(ROLE_ORDER[b.role]??9);
const ROLE={TOP:"Top",JUNGLE:"Jgl",MIDDLE:"Mid",BOTTOM:"ADC",UTILITY:"Sup"};
const KEY={};   // champion id string ("MonkeyKing") → numeric key
let ddv="15.1.1",CHAMP={},DATA=null,etag=null;
fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r=>r.json()).then(v=>{ddv=v[0];return fetch(`https://ddragon.leagueoflegends.com/cdn/${ddv}/data/en_US/champion.json`)})
  .then(r=>r.json()).then(c=>{for(const x of Object.values(c.data)){CHAMP[x.key]={id:x.id,name:x.name,tags:x.tags||[]};KEY[x.id]=+x.key}render()}).catch(()=>{});
let ITEMS={},RUNES={},SPELLS={};
fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r=>r.json()).then(v=>Promise.all([
  fetch(`https://ddragon.leagueoflegends.com/cdn/${v[0]}/data/en_US/item.json`).then(r=>r.json()).then(j=>{ITEMS=j.data}),
  fetch(`https://ddragon.leagueoflegends.com/cdn/${v[0]}/data/en_US/runesReforged.json`).then(r=>r.json()).then(j=>{j.forEach(t=>{RUNES[t.id]={name:t.name,icon:t.icon};t.slots.forEach(s=>s.runes.forEach(r=>RUNES[r.id]={name:r.name,icon:r.icon}))})}),
  fetch(`https://ddragon.leagueoflegends.com/cdn/${v[0]}/data/en_US/summoner.json`).then(r=>r.json()).then(j=>{Object.values(j.data).forEach(x=>SPELLS[x.key]={name:x.name,img:x.image.full})})])).then(render).catch(()=>{});
const itemIcon=id=>`https://ddragon.leagueoflegends.com/cdn/${ddv}/img/item/${id}.png`,runeIcon=id=>RUNES[id]?`https://ddragon.leagueoflegends.com/cdn/img/${RUNES[id].icon}`:"";
// A finished item: costs 2000+ gold and builds into nothing (boots count once they're upgraded)
const isCore=id=>{const it=ITEMS[id];return it&&!it.into?.length&&it.gold?.total>=2000&&!(it.tags||[]).includes("Consumable")&&!(it.tags||[]).includes("Boots")};
const isBoots=id=>{const it=ITEMS[id];return it&&(it.tags||[]).includes("Boots")&&it.gold?.total>=900};
const pct=(w,n)=>n?Math.round(w/n*100)+"%":"–";
const icon=id=>CHAMP[id]?`https://ddragon.leagueoflegends.com/cdn/${ddv}/img/champion/${CHAMP[id].id}.png`:"";
const cname=id=>CHAMP[id]?.name||"?";
if(!window.electronOverlay&&!/[?&]bare/.test(location.search))document.body.classList.add("page");

const API="https://api.github.com/repos/HoeschleY/climb-race/contents/data.json?ref=data",RAW="https://raw.githubusercontent.com/HoeschleY/climb-race/data/data.json";
async function fetchData(){
  try{const h={Accept:"application/vnd.github.raw+json"};if(etag)h["If-None-Match"]=etag;const r=await fetch(API,{headers:h,cache:"no-store"});
    if(r.status===304)return null;if(r.ok){etag=r.headers.get("ETag");return r.json()}}catch{}
  const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return r.json()}
async function load(){try{const d=await fetchData();if(d&&d.updatedAt!==DATA?.updatedAt){DATA=d;try{localStorage.setItem("ov-data",JSON.stringify(d))}catch{}render()}}catch{}}
try{DATA=JSON.parse(localStorage.getItem("ov-data")||"null")}catch{}
// Champion win rates by role from every ranked game we've saved (for the draft helper)
let CS=null;const loadCS=()=>fetch("https://raw.githubusercontent.com/HoeschleY/climb-race/data/champstats.json?t="+Math.floor(Date.now()/6e5)).then(r=>r.ok?r.json():null).then(j=>{if(j){CS=j;render()}}).catch(()=>{});
loadCS();setInterval(loadCS,6e5);
// League client state, sent by the desktop app (phase, champ select). Without the app: null.
let CLIENT=null;
if(window.electronOverlay?.onClient)window.electronOverlay.onClient(st=>{CLIENT=st;
  if(st.me&&DATA&&DATA.players[st.me]&&ME!==st.me){ME=st.me;try{localStorage.setItem("ov-me",ME)}catch{}}render()});
let MODE="auto";try{MODE=localStorage.getItem("ov-mode")||"auto"}catch{}
const modeSel=document.getElementById("mode");modeSel.value=MODE;
modeSel.onchange=()=>{MODE=modeSel.value;try{localStorage.setItem("ov-mode",MODE)}catch{}render()};

const meSel=document.getElementById("me");
let ME=null;try{ME=localStorage.getItem("ov-me")}catch{}
meSel.onchange=()=>{ME=meSel.value;try{localStorage.setItem("ov-me",ME)}catch{}render()};
let MIN=false;try{MIN=localStorage.getItem("ov-min")==="1"}catch{}
document.getElementById("min").onclick=()=>{MIN=!MIN;try{localStorage.setItem("ov-min",MIN?"1":"0")}catch{}render()};

function players(){return Object.values(DATA.players).map(p=>({...p,games:Object.values(p.matches||{}).sort((a,b)=>b.at-a.at)}))}
function liveOf(p,all){if(!p.live||Date.now()-Date.parse(DATA.updatedAt)>15*6e4)return null;
  const done=q=>q&&q.games.some(g=>g.at-(g.dur||0)*1e3>=p.live.start-18e4);
  if(Date.now()-p.live.start>70*6e4||done(p)||(p.live.mates||[]).some(m=>done(all.find(x=>x.riotId===m.id))))return null;return p.live}

function render(){
  const ov=document.getElementById("ov");ov.classList.toggle("min",MIN);document.getElementById("min").textContent=MIN?"+":"–";
  if(!DATA)return;const all=players();
  if(meSel.options.length!==all.length){meSel.innerHTML="";all.forEach(p=>meSel.append(new Option(short(p.riotId),p.riotId)))}
  if(!ME||!all.some(p=>p.riotId===ME))ME=all[0].riotId;meSel.value=ME;
  const me=all.find(p=>p.riotId===ME),fresh=Date.now()-Date.parse(DATA.updatedAt)<20*6e4;
  document.getElementById("dot").className="dotl"+(fresh?" on":"");
  // which screen: a preview, the League client's phase (desktop app), or our own live data
  let view=MODE,preview=MODE!=="auto",live=null,draft=null;
  if(!preview){
    const L=liveOf(me,all);
    if(CLIENT?.phase==="ChampSelect"){view="ChampSelect";draft=CLIENT.draft}
    else if(CLIENT?.phase==="Loading"||CLIENT?.phase==="InGame"){view=CLIENT.phase;live=L}
    else if(L){live=L;view=Date.now()-L.start<3*6e4?"Loading":"InGame"}
    else view="Neutral";
  }else if(view==="ChampSelect")draft=sampleDraft(me);
  else if(view!=="Neutral")live=sampleLive(me);
  const pv=document.getElementById("pv");pv.hidden=!preview;pv.textContent=preview?`Preview: ${modeSel.selectedOptions[0].text} · sample data`:"";
  const show=(id,on)=>document.getElementById(id).hidden=!on;
  show("draft",view==="ChampSelect");show("live",view==="Loading"||view==="InGame");show("sess",view==="Neutral");show("stand",view==="Neutral");
  if(view==="ChampSelect")renderDraft(me,all,draft);
  if(view==="Loading"||view==="InGame"){document.getElementById("live").classList.toggle("compact",view==="InGame");renderLive(me,all,live,view)}
  if(view==="Neutral"){renderSession(me);renderStand(all)}
}
function renderLive(me,all,live,view){const box=document.getElementById("live");box.innerHTML="";
  if(!live||!live.players){box.append(el("h4",null,view==="Loading"?"Loading screen":"In game"),el("div","form","Waiting for the game's data from Riot. It usually shows up within a minute of the loading screen."));return}
  const P=live.players.map(x=>{const fr=x.tracked&&all.find(q=>q.riotId===x.tracked);return fr?.current?{...x,rank:{...fr.current,hot:x.rank?.hot}}:x});
  const my=live.team,rk=P.filter(x=>x.rank).map(x=>score(x.rank)),avg=rk.length?rk.reduce((a,b)=>a+b,0)/rk.length:null;
  const h=el("h4",null,view==="InGame"?"Enemies":"Enemy team · scouting");const tm=el("span");tm.dataset.start=live.start;h.append(tm);box.append(h);
  const partner=P.filter(x=>x.team===my&&x.party&&x.party===P.find(y=>y.tracked===ME)?.party&&x.tracked!==ME);
  P.filter(x=>x.team!==my).sort(byRole).forEach(x=>{let t=0;const why=[],weak=[];
    if(x.rank?.hot){t+=2;why.push("win streak")}
    if(x.mastery?.pts>=200000){t+=2;why.push(`OTP ${Math.round(x.mastery.pts/1000)}k`)}else if(x.mastery?.pts>=75000){t+=1;why.push(`${Math.round(x.mastery.pts/1000)}k mastery`)}
    if(x.rank&&avg!=null){const d=score(x.rank)-avg;if(d>=100){t+=Math.min(3,Math.floor(d/100));why.push("above lobby")}else if(d<=-150)weak.push("below lobby")}
    const n=x.rank?x.rank.wins+x.rank.losses:0,wr=n?x.rank.wins/n:0;
    if(n>=40&&wr>=.56){t+=1;why.push(`${Math.round(wr*100)}% WR`)}else if(n>=40&&wr<=.45)weak.push(`${Math.round(wr*100)}% WR`);
    if(x.party)t+=1;
    if(x.mastery&&x.mastery.pts<10000)weak.push("new on champ");if(x.rank===null)weak.push("unranked");
    const r=el("div","row");const im=el("img");im.src=icon(x.champId);im.alt="";r.append(im);
    const nm=el("div","n");nm.append(el("b",null,cname(x.champId))," ",el("small",null,ROLE[x.role]||""));
    if(x.party)nm.append(el("span","tag t-duo","DUO"));
    if(t>=3)nm.append(el("span","tag t-thr","THREAT"));else if(weak.length&&t<2)nm.append(el("span","tag t-weak","WEAK"));
    r.append(nm,el("span","r",x.rank?fmtS(x.rank):"Unr."));box.append(r);
    const f=x.form;if(f&&f.n){const kda=((f.k+f.a)/Math.max(1,f.d)).toFixed(1);
      const fl=el("div","form",`Last ${f.n}: ${f.w}W ${f.n-f.w}L · ${f.k}/${f.d}/${f.a} · ${f.csm} cs/m`+(f.on?` · ${f.on}× this champ`:""));fl.title=`${kda} KDA. ${f.on?`${f.on} of the last ${f.n} on ${cname(x.champId)} (${f.onW}W)`:`None of the last ${f.n} on ${cname(x.champId)}`}`;box.append(fl)}
    else if(f)box.append(el("div","form","Loading recent games…"));
    const txt=(t>=2?why:[]).concat(weak).join(" · ");if(txt)box.append(el("div","why",txt))});
  const ourD=new Set(P.filter(x=>x.team===my&&x.party).map(x=>x.party)).size,thD=new Set(P.filter(x=>x.team!==my&&x.party).map(x=>x.party)).size;
  box.append(el("div","why",`Premades: ${ourD} yours, ${thD} theirs`+(partner.length?` · you're duo with ${short(partner[0].name)}`:"")));
  const mine=P.find(y=>y.tracked===ME);if(mine)buildBlock(box,mine);
  tick()}
// Ability icons, loaded once per champion
const SKI={};function skillIcons(id){const c=CHAMP[id];if(!c||SKI[id])return SKI[id];SKI[id]="loading";
  fetch(`https://ddragon.leagueoflegends.com/cdn/${ddv}/data/en_US/champion/${c.id}.json`).then(r=>r.json()).then(j=>{const sp=j.data[c.id].spells;SKI[id]=sp.map(x=>({img:`https://ddragon.leagueoflegends.com/cdn/${ddv}/img/spell/${x.image.full}`,name:x.name}));render()}).catch(()=>{});return SKI[id]}
const TYPE_NAME={AP:"AP",AD:"AD",Tank:"Tank"};
function buildBlock(box,x){const R0=x.rec,ch=CHAMP[x.champId];
  const h=el("h4",null,`Build · ${cname(x.champId)}`+(x.role?" "+(ROLE[x.role]||""):""));box.append(h);
  if(!R0||!R0.n){box.append(el("div","why","No saved games on this champion yet."))}
  else{
    // AD / AP / Tank builds: pick one (remembered per champion)
    let r=R0;const vs=R0.variants||[];
    if(vs.length>1){let pick=null;try{pick=localStorage.getItem("ov-var-"+x.champId)}catch{}
      r=vs.find(v=>v.type===pick)||vs[0];const bar=el("div","vars");
      vs.forEach(v=>{const b=el("button",v===r?"on":"");b.append(TYPE_NAME[v.type]||v.type,el("small",null,`${v.n} games · ${pct(v.w,v.n)}`));
        b.onclick=()=>{try{localStorage.setItem("ov-var-"+x.champId,v.type)}catch{}render()};bar.append(b)});box.append(bar)}
    const card=el("div","card");box.append(card);
    card.append(el("div","why",`${r.n} ranked game${r.n>1?"s":""} in our data${r.role?"":" (all roles)"} · ${pct(r.w,r.n)} wins`+(r.n<15?" · small sample":"")));
    // runes: most played full page, else the most played keystone + secondary tree

/* ---------- Draft helper (champ select) ---------- */
const POSN={TOP:"Top",JUNGLE:"Jungle",MIDDLE:"Mid",BOTTOM:"ADC",UTILITY:"Support"};
const shr=(w,n,k=2)=>(w+k/2)/(n+k);   // win rate pulled toward 50% when there are few games
// most common role of a champion in our data
const mainRole=key=>{const r=CS?.roles?.[key];if(!r)return null;let b=null,bn=0;for(const[k,v]of Object.entries(r))if(k!=="?"&&v[0]>bn){b=k;bn=v[0]}return b};
const dmgType=id=>{const t=CHAMP[id]?.tags||[];return t[0]==="Mage"||(t[0]==="Support"&&t[1]==="Mage")?"AP":t[0]==="Tank"||t[0]==="Support"?"-":"AD"};
const isFront=id=>{const t=CHAMP[id]?.tags||[];return t[0]==="Tank"||(t[0]==="Fighter"&&t.includes("Tank"))||(t[0]==="Support"&&t.includes("Tank"))};
function myMainPos(me){const c={};me.games.forEach(g=>{if(g.role)c[g.role]=(c[g.role]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"MIDDLE"}
function draftRecs(me,all,d){
  const my=d.allies.find(a=>a.cell===d.me)||{},pos=my.pos||myMainPos(me);
  const taken=new Set([...d.bans,...d.enemies.map(e=>e.champ),...d.allies.filter(a=>a.cell!==d.me).map(a=>a.champ)].filter(Boolean));
  const allyIds=d.allies.filter(a=>a.cell!==d.me).map(a=>a.champ||a.hover).filter(Boolean),enemyIds=d.enemies.map(e=>e.champ).filter(Boolean);
  // enemy laner: their assigned position if shown, else a locked champ whose usual role is ours
  const opp=d.enemies.find(e=>e.champ&&e.pos===pos)||d.enemies.find(e=>e.champ&&!e.pos&&mainRole(CHAMP[e.champ]?.id)===pos);
  const group=all.flatMap(p=>p.games);
  const cand=new Set();me.games.forEach(g=>cand.add(g.champ));
  Object.entries(CS?.roles||{}).forEach(([k,r])=>{if(r[pos]?.[0]>=8)cand.add(k)});
  const ap=allyIds.filter(i=>dmgType(i)==="AP").length,ad=allyIds.filter(i=>dmgType(i)==="AD").length,front=allyIds.filter(isFront).length;
  const out=[];
  for(const k of cand){const id=KEY[k];if(!id||taken.has(id))continue;
    const mine=me.games.filter(g=>g.champ===k),inRole=mine.filter(g=>g.role===pos),use=inRole.length?inRole:mine;
    const n=use.length,w=use.filter(g=>g.win).length,rt=use.filter(g=>g.rating!=null),rating=rt.length?rt.reduce((s,g)=>s+g.rating,0)/rt.length:null;
    const cs=CS?.roles?.[k]?.[pos]||[0,0];if(!inRole.length&&cs[0]<8&&mainRole(k)!==pos)continue;   // never suggest a champ off-role
    let sc=0;const why=[],bad=[];
    if(n){sc+=Math.min(2,Math.log2(1+n)/2)+(shr(w,n,3)-.5)*5+(rating!=null?(rating-5)*.35:0);why.push(`you: ${n}g ${pct(w,n)}${rating!=null?` · ${rating.toFixed(1)}`:""}${inRole.length?"":" (other role)"}`)}
    if(cs[0]){const d0=(shr(cs[1],cs[0],10)-.5)*4;sc+=d0;if(cs[0]>=8)why.push(`our data: ${pct(cs[1],cs[0])} in ${cs[0]}g`)}
    if(opp){const vs=group.filter(g=>g.champ===k&&(g.vs||[]).includes(CHAMP[opp.champ]?.id)),vw=vs.filter(g=>g.win).length;
      if(vs.length){sc+=(shr(vw,vs.length)-.5)*3;(vw/vs.length>=.5?why:bad).push(`${vw}W ${vs.length-vw}L vs ${cname(opp.champ)}`)}}
    const t=dmgType(id);
    if(allyIds.length>=2&&ap===0&&t==="AP"){sc+=.7;why.push("adds magic damage")}
    if(allyIds.length>=2&&ad===0&&t==="AD"){sc+=.7;why.push("adds physical damage")}
    if(allyIds.length>=3&&ap+ad>=3&&(t==="AP"?ap:ad)>=3){sc-=.5;bad.push(`team already ${t}-heavy`)}
    if(allyIds.length>=2&&front===0&&isFront(id)){sc+=.5;why.push("adds frontline")}
    out.push({id,k,sc,why,bad,n})}
  return{pos,opp,list:out.sort((a,b)=>b.sc-a.sc).slice(0,5)};
}
function banRecs(me,all,d){
  const taken=new Set([...d.bans,...d.enemies.map(e=>e.champ),...d.allies.map(a=>a.champ||a.hover)].filter(Boolean)),m={};
  const add=(g,wt)=>(g.vs||[]).forEach(k=>{const e=m[k]=m[k]||{k,n:0,w:0,mn:0,mw:0};e.n+=wt;e.w+=g.win?wt:0;if(wt===2){e.mn++;e.mw+=g.win?1:0}});
  all.forEach(p=>p.games.forEach(g=>add(g,p.riotId===me.riotId?2:1)));
  return Object.values(m).filter(e=>KEY[e.k]&&!taken.has(KEY[e.k])&&e.n>=4).map(e=>({...e,sc:(1-shr(e.w,e.n,4))*Math.log2(1+e.n)})).sort((a,b)=>b.sc-a.sc).slice(0,3);
}
function renderDraft(me,all,d){const box=document.getElementById("draft");box.innerHTML="";
  if(!d){box.append(el("h4",null,"Champ select"),el("div","form","Reading champ select…"));return}
  const R=draftRecs(me,all,d),my=d.allies.find(a=>a.cell===d.me)||{};
  const h=el("h4",null,`Champ select · ${POSN[R.pos]||"?"}`);const tm=el("span",d.turn?"turn":"",d.turn?`Your ${d.turn} · ${d.left}s`:d.left?`${d.left}s`:"");h.append(tm);box.append(h);
  // teams
  const picks=el("div","picks");
  const col=(title,list,isAlly)=>{const c=el("div","col");c.append(el("h5",null,title));
    list.forEach(x=>{const id=x.champ||x.hover,r=el("div","mini"+(isAlly&&x.cell===d.me?" me":""));const im=el("img");if(id)im.src=icon(id);im.alt="";if(!x.champ&&x.hover)im.style.opacity=.45;r.append(im);
      let t=id?cname(id):"…";if(!x.champ&&x.hover)t+=" (hover)";if(isAlly&&x.pos)t=`${ROLE[x.pos]||""} · ${t}`;
      if(!isAlly&&x.champ){const k=CHAMP[x.champ]?.id,gs=all.flatMap(p=>p.games).filter(g=>(g.vs||[]).includes(k)),w=gs.filter(g=>g.win).length;if(gs.length)t+=` · us ${w}-${gs.length-w}`}
      r.append(el("span",null,t));c.append(r)});return c};
  picks.append(col("Your team",d.allies,true),col("Enemy team",d.enemies,false));box.append(picks);
  if(d.bans.length){const b=el("div","icons banrow");b.append(el("span","lbl","Bans"));d.bans.forEach(id=>{const im=el("img");im.src=icon(id);im.title=cname(id);im.alt="";b.append(im)});box.append(b)}
  // pick suggestions
  box.append(el("h4",null,R.opp?`Picks · vs ${cname(R.opp.champ)}`:"Picks for you"));
  if(!R.list.length)box.append(el("div","form","Not enough games in our data for this role yet."));
  R.list.forEach(c=>{const r=el("div","drow");const im=el("img");im.src=icon(c.id);im.alt="";if(my.hover===c.id||my.champ===c.id)im.style.outline="2px solid var(--gold)";r.append(im);
    const n=el("div","n");n.append(el("b",null,cname(c.id)));const ch=el("div","chips");c.why.forEach(t=>ch.append(el("span","chip",t)));c.bad.forEach(t=>ch.append(el("span","chip bad",t)));n.append(ch);
    r.append(n,el("span","sc",(c.sc>0?"+":"")+c.sc.toFixed(1)));box.append(r)});
  // ban suggestions
  const bans=banRecs(me,all,d).filter(b=>!R.list.slice(0,3).some(c=>c.k===b.k));
  if(bans.length&&(!d.turn||d.turn==="ban"||d.phase==="BAN_PICK"||d.phase==="PLANNING")){box.append(el("h4",null,"Ban suggestions"));
    bans.forEach(b=>{const r=el("div","mini");const im=el("img");im.src=icon(KEY[b.k]);im.alt="";r.append(im,el("span",null,`${cname(KEY[b.k])} · group ${b.w}-${b.n-b.w}`+(b.mn?` · you ${b.mw}-${b.mn-b.mw}`:"")));box.append(r)})}
  box.append(el("div","form",`Scores mix your games on the champ, win rates from ${CS?.games||"our"} saved ranked games, the matchup and your team's damage mix.`));
}
