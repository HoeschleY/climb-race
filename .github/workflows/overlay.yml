name: Build overlay app

# Builds the Windows overlay (desktop/) and attaches ClimbRaceOverlay.exe to the "overlay" release.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/overlay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete overlay --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create overlay desktop/dist/ClimbRaceOverlay.exe --repo ${{ github.repository }} \
            --title "Climb Race Overlay" \
            --notes "Download ClimbRaceOverlay.exe and run it (no install). Play League in Borderless mode. Ctrl+Shift+O shows/hides, Ctrl+Shift+L locks it so clicks go to the game. Right-click the tray icon for more."
